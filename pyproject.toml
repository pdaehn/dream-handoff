[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dream-handoff"
version = "0.0.0"
description = "LeRobot-based research on asynchronous, world-model-guided policy handoffs."
authors = [{ name = "Paul Dähn" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = "==3.12.*"
dependencies = [
  "lerobot[dataset,smolvla]",
  "numpy>=1.26",
  "torch>=2.5,<3.0",
]

[dependency-groups]
dev = [
  "matplotlib>=3.10,<4",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dream_handoff"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA device and exercises torch.compile",
  "diagnostic_artifact: requires the external final format-16 diagnostic NPZ",
  "dataset_artifact: requires DREAMHANDOFF_DATASET to point to the recovered final dataset",
  "inference_artifacts: requires external SmolVLA, R2, and dataset artifacts",
  "prefix_policy_replay: requires the external final SmolVLA policy and format-16 capture",
  "r2_checkpoint: requires DREAMHANDOFF_R2_CHECKPOINT to point to the external final artifact",
  "r2_training: requires DREAMHANDOFF_DATASET and DREAMHANDOFF_SPLIT for real-data training",
  "smolvla_artifact: requires DREAMHANDOFF_POLICY to point to the recovered final policy",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "c841a0c25833b866970c5a31d66c2bff60f171de" }
